version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: srms-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-srms}
      POSTGRES_USER: ${DB_USER:-srms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-srms_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432" # external access optional (if needed)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-srms_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: srms-backend
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    networks:
      - srms-net
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_PORT: ${APP_PORT:-5000}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-srms}
      DB_USER: ${DB_USER:-srms_user}
      DB_PASSWORD: ${DB_PASSWORD:-srms_password}
      JWT_SECRET: ${JWT_SECRET:-supersecret}

networks:
  srms-net:
    driver: bridge

volumes:
  postgres-data: